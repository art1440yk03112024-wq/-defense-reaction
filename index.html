<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEFENSE REACTION">
<meta name="theme-color" content="#111111">
<title>DEFENSE REACTION</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  .app {
    width: min(520px, 100%);
    margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  h1 { text-align:center; font-size:28px; margin:12px 0 4px; letter-spacing:1px; }
  .subtitle { text-align:center; color:#aaa; margin-bottom:24px; }
  .card {
    background:#1d1d1d;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
  }
  .direction {
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    font-weight:800;
    letter-spacing:8px;
  }
  .status { text-align:center; color:#aaa; min-height:22px; }
  .time { text-align:center; font-size:28px; font-weight:700; margin-top:8px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  label { display:block; color:#bbb; font-size:14px; margin-bottom:8px; }
  select, button {
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    font-size:17px;
    font-weight:700;
  }
  select { background:#2b2b2b; color:#fff; }
  button { background:#fff; color:#111; margin-top:8px; }
  button.stop { background:#444; color:#fff; }
  button:disabled { opacity:.4; }
  .start {
    background:#2d8cff;
    color:#fff;
    font-size:20px;
    padding:16px;
  }
  .stats {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat {
    background:#292929;
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  .stat small { display:block; color:#aaa; }
  .stat strong { display:block; font-size:22px; margin-top:3px; }
  .hidden { display:none; }
  .note { color:#999; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<div class="app">
  <h1>DEFENSE REACTION</h1>
  <div class="subtitle">Basketball Defense Training</div>

  <div class="card">
    <div id="direction" class="direction">READY</div>
    <div id="status" class="status">スタートすると3秒カウントダウンします</div>
    <div id="time" class="time">30.0 秒</div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label for="duration">練習時間</label>
        <select id="duration">
          <option value="30">30秒</option>
          <option value="60">60秒</option>
          <option value="90">90秒</option>
        </select>
      </div>
      <div>
        <label for="difficulty">難易度</label>
        <select id="difficulty">
          <option value="easy">EASY</option>
          <option value="normal" selected>NORMAL</option>
          <option value="hard">HARD</option>
          <option value="extreme">EXTREME</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top:12px;">
      <div>
        <label for="repeat">同じ方向の連続</label>
        <select id="repeat">
          <option value="yes" selected>許可</option>
          <option value="no">禁止</option>
        </select>
      </div>
      <div>
        <label for="voiceRate">音声速度</label>
        <select id="voiceRate">
          <option value="0.85">ゆっくり</option>
          <option value="1" selected>標準</option>
          <option value="1.15">速い</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <button id="start" class="start">▶ START</button>
    <button id="stop" class="stop" disabled>■ STOP</button>
  </div>

  <div id="result" class="card hidden">
    <h2 style="margin-top:0;text-align:center;">TRAINING COMPLETE</h2>
    <div class="stats">
      <div class="stat"><small>指示回数</small><strong id="countStat">0</strong></div>
      <div class="stat"><small>平均間隔</small><strong id="avgStat">-</strong></div>
      <div class="stat"><small>最短間隔</small><strong id="minStat">-</strong></div>
      <div class="stat"><small>方向転換</small><strong id="changeStat">0</strong></div>
    </div>
  </div>

  <div class="card note">
    音声指示が出たら、その方向へ移動し続けてください。次の指示が出たら、その方向へ切り返します。画面を見ずに音声だけで練習するのがおすすめです。
  </div>
</div>

<script>
(() => {
  const words = ["右", "左", "前", "後ろ", "上", "下"];

  // 難易度ごとの「音声と次の音声の間隔」
  const difficulty = {
    easy:    [1500, 3000],
    normal:  [800, 2000],
    hard:    [500, 1200],
    extreme: [500, 1000]
  };

  let running = false;
  let deadline = 0;
  let countdownTimer = null;
  let intervalTimer = null;
  let nextTimer = null;
  let previous = "";
  let count = 0;
  let directionChanges = 0;
  let lastSpokenAt = null;
  let gaps = [];
  let utterance = null;

  const $ = id => document.getElementById(id);

  function setStatus(text) {
    $("status").textContent = text;
  }

  function randomDirection() {
    const allowRepeat = $("repeat").value === "yes";

    let candidates = words;
    if (!allowRepeat && previous) {
      candidates = words.filter(w => w !== previous);
    }

    const next = candidates[Math.floor(Math.random() * candidates.length)];

    if (previous && next !== previous) directionChanges++;
    previous = next;
    return next;
  }

  function speak(text) {
    speechSynthesis.cancel();

    utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    utterance.rate = Number($("voiceRate").value);
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
  }

  function updateTime() {
    if (!running) return;

    const remaining = Math.max(0, deadline - performance.now());
    $("time").textContent = (remaining / 1000).toFixed(1) + " 秒";

    if (remaining <= 0) finish("時間終了！");
  }

  function scheduleNext() {
    if (!running) return;

    const [min, max] = difficulty[$("difficulty").value];
    const gap = Math.floor(min + Math.random() * (max - min + 1));

    nextTimer = setTimeout(() => {
      if (!running) return;
      if (performance.now() >= deadline) {
        finish("時間終了！");
        return;
      }
      speakNext();
    }, gap);
  }

  function speakNext() {
    if (!running) return;

    if (performance.now() >= deadline) {
      finish("時間終了！");
      return;
    }

    const now = performance.now();

    if (lastSpokenAt !== null) {
      gaps.push(now - lastSpokenAt);
    }
    lastSpokenAt = now;

    const direction = randomDirection();

    $("direction").textContent = direction;
    setStatus("その方向へ移動");

    count++;

    speak(direction);
    scheduleNext();
  }

  function finish(message) {
    if (!running) return;

    running = false;

    clearTimeout(countdownTimer);
    clearTimeout(nextTimer);
    clearInterval(intervalTimer);

    speechSynthesis.cancel();

    $("start").disabled = false;
    $("stop").disabled = true;

    $("direction").textContent = "FINISH";
    setStatus(message);
    $("time").textContent = "0.0 秒";

    showResults();
  }

  function showResults() {
    $("result").classList.remove("hidden");

    $("countStat").textContent = count + "回";

    if (gaps.length > 0) {
      const avg = gaps.reduce((a,b) => a+b, 0) / gaps.length;
      const min = Math.min(...gaps);

      $("avgStat").textContent = (avg / 1000).toFixed(2) + "秒";
      $("minStat").textContent = (min / 1000).toFixed(2) + "秒";
    } else {
      $("avgStat").textContent = "-";
      $("minStat").textContent = "-";
    }

    $("changeStat").textContent = directionChanges + "回";
  }

  $("start").addEventListener("click", () => {
    if (running) return;

    speechSynthesis.cancel();

    $("result").classList.add("hidden");
    $("start").disabled = true;
    $("stop").disabled = false;

    running = true;
    previous = "";
    count = 0;
    directionChanges = 0;
    gaps = [];
    lastSpokenAt = null;

    const duration = Number($("duration").value) * 1000;
    deadline = performance.now() + duration;

    $("direction").textContent = "3";
    $("time").textContent = (duration / 1000).toFixed(1) + " 秒";
    setStatus("準備してください");

    // 3秒カウントダウン
    let n = 3;

    const countdown = () => {
      if (!running) return;

      if (n > 0) {
        $("direction").textContent = n;
        speak(String(n));
        n--;
        countdownTimer = setTimeout(countdown, 1000);
      } else {
        $("direction").textContent = "GO!";
        speak("ゴー");

        // カウントダウン終了後から本番30/60/90秒
        deadline = performance.now() + duration;
        intervalTimer = setInterval(updateTime, 50);

        setTimeout(() => {
          if (running) speakNext();
        }, 500);
      }
    };

    countdown();
  });

  $("stop").addEventListener("click", () => {
    finish("手動で停止しました");
  });
})();
</script>
</body>
</html>
